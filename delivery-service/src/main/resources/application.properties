spring.application.name=delivery-service
server.port=${PORT:8085}
spring.config.import=optional:configserver:http://localhost:8888
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/technova_delivery?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
delivery.rates.standard=10.00
delivery.rates.express=20.00
delivery.rates.pickup=0.00
